<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeFlock Solution - Inventory Management</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="images/sfs_icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="images/sfs_icon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/sfs_icon-180x180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Gochi+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #2b2b2b;
            --paper-front: #ffffff;
            --paper-back: #f8f9fa;
            --paper-yellow: #fffdf5;
            --bg-body: #e9ecef;
            --primary-btn: #ffe66d;
            --primary-hover: #ffd166;
            --secondary-btn: #4ecdc4;
            --action-btn: #ff6b6b;
            --success: #06d6a0;
            --warning: #ff9f1c;
            --border-width: 3px;
            --shadow-offset: 6px;
            --grid-line-color: rgba(0,0,0,0.04);
            --sketch-r1: 8px 24px 8px 24px / 24px 8px 24px 8px;
            --sketch-r2: 24px 8px 24px 8px / 8px 24px 8px 24px;
            --sketch-btn: 12px 18px 12px 18px / 18px 12px 18px 12px;
            --sketch-input: 8px 15px 8px 15px / 15px 8px 15px 8px;
            --font-ui: 'Comic Neue', 'Comic Sans MS', sans-serif;
            --font-display: 'Gochi Hand', 'Marker Felt', cursive;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-body);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
            background-image:
                linear-gradient(var(--grid-line-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--grid-line-color) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .top-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--paper-front);
            border: var(--border-width) solid var(--ink);
            border-radius: var(--sketch-r1);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--ink);
            z-index: 50;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--ink);
            padding: 5px;
            transform: rotate(-3deg);
            transition: transform 0.3s;
        }
        .brand-wrapper:hover .logo-box {
            transform: rotate(5deg) scale(1.1);
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-text-stack {
            display: flex;
            flex-direction: column;
        }
        .brand-title-main {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: bold;
            color: var(--ink);
            line-height: 1;
            margin-bottom: 2px;
        }
        .brand-title-sub {
            font-size: 11px;
            font-weight: 900;
            color: var(--action-btn);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 36px;
            color: var(--ink);
            margin-bottom: 10px;
            transform: rotate(-1deg);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .inventory-layout {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 25px;
            align-items: start;
        }

        .panel {
            background-color: var(--paper-front);
            border: var(--border-width) solid var(--ink);
            border-radius: var(--sketch-r1);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--ink);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            background-image: repeating-linear-gradient(transparent, transparent 28px, rgba(0,0,0,0.05) 28px, rgba(0,0,0,0.05) 30px);
            background-position: 0 10px;
        }

        .panel:nth-child(even) {
            border-radius: var(--sketch-r2);
            background-color: var(--paper-yellow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(0,0,0,0.2);
            padding-bottom: 15px;
            margin-bottom: 5px;
            background-color: inherit;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 26px;
            color: var(--ink);
        }

        .doodle-tabs {
            display: flex;
            gap: 10px;
            background: var(--paper-back);
            padding: 8px;
            border-radius: var(--sketch-r1);
            border: 2px solid var(--ink);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: bold;
            color: var(--ink);
            background: transparent;
            border: none;
            border-radius: var(--sketch-r2);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--ink);
            color: var(--paper-front);
            transform: rotate(-1deg) scale(1.02);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid currentColor;
            transition: all 0.3s;
        }
        .tab-btn:not(.active) .status-dot.yellow {
            background-color: var(--warning);
            border-color: var(--ink);
        }
        .tab-btn:not(.active) .status-dot.green {
            background-color: var(--success);
            border-color: var(--ink);
        }
        .tab-btn.active .status-dot.yellow {
            background-color: var(--warning);
            box-shadow: 0 0 5px var(--warning);
        }
        .tab-btn:not(.active) .status-dot.red {
            background-color: #ef4444;
            border-color: var(--ink);
        }
        .tab-btn.active .status-dot.red {
            background-color: #ef4444;
            box-shadow: 0 0 5px #ef4444;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 16px;
            font-weight: 900;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .doodle-input {
            width: 100%;
            padding: 12px 15px;
            font-family: var(--font-ui);
            font-size: 16px;
            font-weight: bold;
            color: var(--ink);
            background-color: var(--paper-front);
            border: 2.5px solid var(--ink);
            border-radius: var(--sketch-input);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            outline: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .doodle-input:focus {
            border-color: var(--secondary-btn);
            box-shadow: 4px 4px 0px var(--secondary-btn);
            transform: translateY(-2px) rotate(-0.5deg);
        }

        .doodle-input.disabled {
            background-color: var(--paper-back);
            color: #888;
            cursor: not-allowed;
            border-style: dashed;
        }

        .doodle-select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%232b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            cursor: pointer;
        }

        .operation-group {
            display: flex;
            gap: 10px;
        }

        .op-btn {
            flex: 1;
            padding: 10px;
            font-family: var(--font-ui);
            font-weight: bold;
            font-size: 14px;
            border: 2px solid var(--ink);
            border-radius: var(--sketch-r1);
            background: var(--paper-front);
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .op-btn.active.add {
            background: var(--success);
            color: var(--ink);
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 3px 3px 0px var(--ink);
        }
        .op-btn.active.deduct {
            background: var(--action-btn);
            color: white;
            transform: scale(1.05) rotate(2deg);
            box-shadow: 3px 3px 0px var(--ink);
        }
        .op-btn.active.set {
            background: var(--secondary-btn);
            color: var(--ink);
            transform: scale(1.05) rotate(-1deg);
            box-shadow: 3px 3px 0px var(--ink);
        }
        .op-btn:hover:not(.active) {
            transform: translateY(-2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .qty-adjust-area {
            display: flex;
            gap: 15px;
            align-items: stretch;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 15px;
            border: 2px dashed rgba(0,0,0,0.1);
        }

        .qty-display-box {
            flex: 1;
            background: var(--ink);
            color: var(--paper-front);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
            transform: rotate(-1deg);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .qty-display-box.pulse {
            animation: bounce 0.3s ease;
        }

        .qty-controls {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
        }

        .qty-controls span {
            transition: all 0.1s;
            padding: 0 10px;
        }
        .qty-controls span:hover {
            color: var(--primary-btn);
            transform: scale(1.3);
        }
        .qty-controls span:active {
            transform: scale(0.9);
        }

        .qty-number {
            font-family: var(--font-display);
            font-size: 48px;
            text-align: center;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.2);
        }

        .quick-add-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: space-between;
        }

        .quick-btn {
            background: var(--paper-back);
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 8px;
            font-weight: bold;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .quick-btn:hover {
            background: var(--primary-btn);
            transform: translateX(-3px) rotate(-1deg);
            box-shadow: 4px 4px 0px var(--ink);
        }
        .quick-btn:active {
            transform: translate(0, 0);
            box-shadow: 0px 0px 0px transparent;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: bold;
            color: var(--ink);
            background: var(--primary-btn);
            border: 3px solid var(--ink);
            border-radius: var(--sketch-btn);
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--ink);
            transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .action-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-4px) rotate(-1deg);
            box-shadow: 6px 6px 0px var(--ink);
        }
        .action-btn:active {
            transform: translate(2px, 2px) rotate(0deg);
            box-shadow: 0px 0px 0px transparent;
        }

        .action-btn.green {
            background: var(--success);
            color: var(--paper-front);
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }
        .action-btn.green:hover {
            filter: brightness(1.1);
        }

        .refresh-btn {
            background: var(--paper-front);
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            font-family: var(--font-ui);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 2px 2px 0px var(--ink);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .refresh-btn:hover {
            transform: rotate(5deg) scale(1.05);
            background: var(--paper-yellow);
        }
        .refresh-btn:active {
            transform: translate(2px,2px);
            box-shadow: 0 0 0 transparent;
        }
        .refresh-btn svg {
            transition: transform 0.5s ease;
        }
        .refresh-btn.spinning svg {
            transform: rotate(360deg);
        }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-height: 900px;
            overflow-y: auto;
            padding-right: 10px;
            margin-top: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--ink) var(--paper-back);
        }

        .inventory-list::-webkit-scrollbar {
            width: 10px;
        }
        .inventory-list::-webkit-scrollbar-track {
            background: var(--paper-back);
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .inventory-list::-webkit-scrollbar-thumb {
            background: var(--ink);
            border-radius: 10px;
            border: 2px solid var(--paper-back);
        }
        .inventory-list::-webkit-scrollbar-thumb:hover {
            background: #000;
        }

        .inv-item {
            background: var(--paper-front);
            border: 2.5px solid var(--ink);
            border-radius: 18px;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.12);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: slide-in-right 0.4s ease forwards;
            opacity: 0;
            transform: translateX(20px);
            gap: 40px;
        }

        .inv-item.selected {
            background-color: var(--paper-yellow);
            border-color: var(--secondary-btn);
            box-shadow: 5px 5px 0px var(--secondary-btn);
            transform: translateX(-5px) rotate(-1deg);
            z-index: 10;
        }

        .inv-item:hover:not(.selected) {
            transform: translateX(-3px) translateY(-2px);
            box-shadow: 5px 5px 0px var(--ink);
        }

        .inv-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
            min-width: 0;
        }

        .inv-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .inv-pill {
            background: var(--paper-back);
            border: 1.5px solid var(--ink);
            padding: 4px 12px;
            border-radius: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
            font-weight: 900;
        }

        .inv-name {
            font-family: var(--font-display);
            font-size: 26px;
            color: var(--ink);
            line-height: 1.2;
            word-break: break-word;
        }

        .inv-price {
            color: var(--success);
            font-weight: 900;
            font-size: 18px;
            background: rgba(6, 214, 160, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px dashed var(--success);
            transform: rotate(-2deg);
            margin-top: 3px;
            align-self: flex-start;
        }

        .inv-date {
            font-size: 13px;
            color: #666;
            font-weight: bold;
            margin-top: 6px;
        }

        .inv-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--ink);
            background-color: var(--paper-back);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transform: rotate(-2deg);
            transition: transform 0.2s;
        }
        .inv-item:hover .inv-thumbnail {
            transform: rotate(2deg) scale(1.05);
        }

        .inv-qty-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 2;
            min-width: 70px;
        }

        .qty-label {
            color: var(--success);
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
        }

        .qty-value {
            font-family: var(--font-display);
            font-size: 44px;
            color: var(--ink);
            line-height: 1;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1) rotate(-1deg);
            }
            50% {
                transform: scale(1.05) rotate(1deg);
            }
        }
        @keyframes slide-in-right {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes form-swap {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .form-section {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .form-section.active {
            display: flex;
            animation: form-swap 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2.5px dashed var(--ink);
            border-radius: var(--sketch-input);
            background: var(--paper-back);
            color: var(--ink);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-label:hover {
            background: var(--primary-btn);
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--ink);
            border-style: solid;
        }

        .img-preview-box {
            display: none;
            margin-top: 10px;
            position: relative;
            border: 2px solid var(--ink);
            border-radius: 12px;
            padding: 5px;
            background: white;
            width: 100px;
            height: 100px;
            transform: rotate(2deg);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }
        .img-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .remove-img-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--action-btn);
            color: white;
            border: 2px solid var(--ink);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .toast-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: var(--ink);
            color: var(--paper-front);
            padding: 15px 30px;
            border-radius: var(--sketch-r2);
            font-family: var(--font-display);
            font-size: 22px;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 6px 6px 0px var(--primary-btn);
            text-align: center;
            border: 3px solid var(--paper-front);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-msg.show {
            transform: translateX(-50%) translateY(0) rotate(-1deg);
        }
        .selected-remove { transform: scale(1.08); box-shadow: 0 0 0 4px #ef4444, 6px 6px 0 #8b0000; animation: selectBounce .5s cubic-bezier(.34,1.56,.64,1); position: relative; }
        .selected-remove::after { content: '✓'; position: absolute; top: 4px; right: 6px; background: #ef4444; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; box-shadow: 2px 2px 0 #8b0000; animation: popIn .3s ease; }
        @keyframes selectBounce { 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-3deg)} 70%{transform:scale(1.05) rotate(2deg)} 100%{transform:scale(1.08)} }
        @keyframes shakeOut { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.05) rotate(2deg)} 100%{transform:scale(0);opacity:0} }
    </style>
</head>
<body>

    <div id="toast" class="toast-msg">
        <span id="toastIcon">✨</span>
        <span id="toastText">Action triggered!</span>
    </div>

    <div class="container">
        <header class="top-header">
            <a href="#" class="brand-wrapper">
                <div class="logo-box">

                        Update Inventory
                    </button>
                    <p style="font-size: 13px; font-weight: bold; color: #666; text-align: center;">Select an item from the right panel to begin.</p>

                <div id="formRemove" class="form-section">
                    <div class="form-group">

                            <option value="vaccines">Vaccines</option>

                    </div>
                    <div class="form-group">
                        <label class="form-label">Select Product to Remove</label>

                    <button class="action-btn" id="removeBtn" style="background:#ef4444;color:#fff;width:100%;display:none;" onclick="removeProduct()">Delete Product</button>

                <div id="removeConfirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
                    <div style="background:var(--paper-front);border:4px solid var(--ink);border-radius:20px;padding:30px;max-width:420px;width:90%;text-align:center;box-shadow:8px 8px 0 var(--ink);animation:popIn .25s ease;">
                        <h2 style="margin:0 0 12px;font-family:var(--font-display);">Delete Product?</h2>
                        <img id="rmConfirmImg" src="" style="width:100%;height:180px;object-fit:cover;border-radius:12px;border:3px solid var(--ink);margin-bottom:12px;" onerror="this.style.display='none'">
                        <p id="rmConfirmName" style="font-weight:900;font-size:18px;margin:8px 0 4px;"></p>
                        <p id="rmConfirmCode" style="font-size:13px;color:#666;margin:0 0 16px;"></p>
                        <div style="display:flex;gap:12px;justify-content:center;">
                            <button class="doodle-btn" style="padding:10px 24px;font-size:16px;" onclick="closeRemoveConfirm()">Cancel</button>
                            <button class="doodle-btn" style="padding:10px 24px;font-size:16px;background:#ef4444;color:#fff;border-color:#8b0000;box-shadow:3px 3px 0 #8b0000;" onclick="confirmRemove()">Delete</button>

                    <div class="form-group">

                                <div class="qty-controls">
                                    <span onclick="adjustNewQty(-1)">-</span>

                                    <span onclick="adjustNewQty(1)">+</span>
                                </div>

                                <button class="quick-btn" onclick="setNewQty(50)">Set 50</button>
                                <button class="quick-btn" onclick="setNewQty(100)">Set 100</button>

            <div class="panel" style="background-color: var(--paper-yellow);">
                <div class="panel-header">

                        <div class="panel-title">Live Register</div>

                    </div>
                    <button class="refresh-btn" id="refreshBtn" onclick="refreshList()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><line x1="1" y1="20" x2="7" y2="14"></line><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        Refresh
                    </button>

    <script>
        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toastIcon').innerText = icon;
            document.getElementById('toastText').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }

        let currentOperation = 'add';
        let currentQty = 10;
        let selectedItem = null;
        let selectedRemoveId = null;
        let selectedRemoveProduct = null;
        let currentUploadedImage = null;
        let allInventoryData = [];

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
        }

        async function loadInventory() {
            const list = document.getElementById('invList');
            list.innerHTML = '<div class="muted" style="font-weight:900;">Select a category to view inventory.</div>';

            try {
                const res = await fetch('api/inventory.php');
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || data.message || 'Failed to load inventory');
                allInventoryData = data.inventory || [];
                buildCategoryFilters(allInventoryData);
            } catch (e) {
                list.innerHTML = '<b style="color:#ef4444;">Error:</b> ' + (e.message || 'Failed to load');
                console.error(e);
            }
        }

        function buildCategoryFilters(items) {
            const allCats = ['vaccines','layer_meds','feed_meds','water','meds','supplies'];
            const dataCats = Array.from(new Set(items.map(i => i.category).filter(Boolean))).sort();
            const cats = Array.from(new Set([...allCats, ...dataCats])).sort();
            const adjustSelect = document.getElementById('adjCategory');
            const newCatSelect = document.getElementById('newCat');
            if (adjustSelect) {
                adjustSelect.innerHTML = '<option value="" selected>Select a category</option>' +
                    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            }
            if (newCatSelect) {
                newCatSelect.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            }
        }

        function getCategoryThumb(category, logoPath) {
            if (logoPath) {
                return String(logoPath).replace(/\\/g, '/');
            }
            const map = {
                vaccines: { bg: '#4ecdc4', text: 'Vax' },
                meds: { bg: '#ff6b6b', text: 'Meds' },
                supplies: { bg: '#9b5de5', text: 'Sup' },
                water: { bg: '#4ecdc4', text: 'H2O' },
                layer_meds: { bg: '#ff6b6b', text: 'Meds' },
                feed_meds: { bg: '#ff9f1c', text: 'Feed' }
            };
            const key = (category || '').toLowerCase();
            const info = map[key] || { bg: '#ffe66d', text: 'New' };
            return `https://placehold.co/100x100/${encodeURIComponent(info.bg)}/2b2b2b?text=${encodeURIComponent(info.text)}`;
        }

        function renderList(filterCat = '') {
            const list = document.getElementById('invList');
            list.innerHTML = '';

            if (!filterCat) {
                list.innerHTML = '<div class="muted" style="font-weight:900;">Select a category to view inventory.</div>';
                return;
            }

            let filteredData = allInventoryData;
            if (filterCat !== 'all') {
                filteredData = allInventoryData.filter(i => i.category === filterCat);
            }

            if (!filteredData.length) {
                list.innerHTML = '<div class="muted" style="font-weight:900;">No inventory rows.</div>';
                return;
            }

            filteredData.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'inv-item';
                el.style.animationDelay = `${index * 0.05}s`;

                if (selectedItem && selectedItem.product_id === item.product_id) {
                    el.classList.add('selected');
                }

                el.onclick = () => selectItemForAdjust(item, el);

                let qtyColor = 'var(--ink)';
                const qty = Number(item.qty || 0);
                if (qty < 20) qtyColor = 'var(--action-btn)';

                const imgSrc = getCategoryThumb(item.category, item.logo_path);
                const price = item.price ? '₹' + Number(item.price).toFixed(2) : '—';
                const size = item.size || '—';
                const updated = item.updated_at ? String(item.updated_at) : '';

                el.innerHTML = `
                    <div style="display: flex; gap: 20px; align-items: center; flex: 1 1 auto; min-width: 0;">
                        <img src="${escapeHtml(imgSrc)}" class="inv-thumbnail" alt="${escapeHtml(item.product || '')}" onerror="this.src='${escapeHtml(getCategoryThumb(item.category))}'">
                        <div class="inv-details">
                            <div class="inv-name">${escapeHtml(item.product || '')}</div>
                            <div class="inv-meta">
                                <span class="inv-pill">${escapeHtml(item.category || '—')}</span>
                                <span style="color: #d97706;">${escapeHtml(size)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="inv-qty-box">
                        <span class="qty-label">Qty</span>
                        <span class="qty-value" style="color: ${qtyColor}">${qty}</span>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        async function refreshList() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            showToast("Syncing database...", "🔄");

            try {
                await loadInventory();
                showToast("Register Up to Date!", "✅");
            } catch (e) {
                showToast("Failed to refresh", "⚠️");
            } finally {
                btn.classList.remove('spinning');
            }
        }

        function filterProductsForRemoval() {
            const cat = document.getElementById('rmCategory').value;
            const grid = document.getElementById('removeProductGrid');
            grid.innerHTML = '';
            selectedRemoveId = null;
            document.getElementById('removeBtn').style.display = 'none';
            const filtered = cat ? allInventoryData.filter(p => (p.category || '').toLowerCase() === cat.toLowerCase()) : allInventoryData;
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.style.cssText = 'border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;text-align:center;background:var(--paper-front);';
                const imgSrc = getCategoryThumb(p.category, p.logo_path);
                card.innerHTML = `<img src="${escapeHtml(imgSrc)}" style="width:100%;height:60px;object-fit:cover;border-radius:8px;" onerror="this.style.display='none'"><div style="font-size:12px;font-weight:900;margin-top:4px;">${escapeHtml(p.product || p.name || '')}</div><div style="font-size:10px;color:#666;">Qty: ${p.qty}</div>`;
                card.onclick = () => selectProductToRemove(p.product_id, card);
                grid.appendChild(card);
            });
        }

        function selectProductToRemove(id, card) {
            document.querySelectorAll('#removeProductGrid > div').forEach(c => {
                c.style.borderColor = 'var(--ink)';
                c.classList.remove('selected-remove');
            });
            card.style.borderColor = '#ef4444';
            card.classList.add('selected-remove');
            selectedRemoveId = id;
            selectedRemoveProduct = allInventoryData.find(p => p.product_id === id) || null;
            document.getElementById('removeBtn').style.display = 'block';
        }

        function showRemoveConfirm() {
            if (!selectedRemoveId) return;
            const p = selectedRemoveProduct;
            document.getElementById('rmConfirmName').innerText = p ? (p.product || p.name || '') : '';
            document.getElementById('rmConfirmCode').innerText = p ? ('Code: ' + (p.sku || p.product_id || '')) : '';
            const img = document.getElementById('rmConfirmImg');
            img.style.display = 'block';
            if (p) img.src = getCategoryThumb(p.category, p.logo_path);
            document.getElementById('removeConfirmModal').style.display = 'flex';
        }

        function closeRemoveConfirm() {
            document.getElementById('removeConfirmModal').style.display = 'none';
        }

        async function confirmRemove() {
            closeRemoveConfirm();
            if (!selectedRemoveId) return;
            const cards = document.querySelectorAll('#removeProductGrid > div');
            cards.forEach(c => { if (c.style.borderColor === 'rgb(239, 68, 68)') c.classList.add('removing'); });
            await new Promise(r => setTimeout(r, 400));
            try {
                const form = new FormData();
                form.append('id', selectedRemoveId);
                form.append('csrf_token', getCsrfToken());
                const res = await fetch('api/inventory_remove.php', { method: 'POST', body: form });
                const data = await res.json();
                if (data.ok) {
                    showToast('Product removed', '🗑️');
                    await loadInventory();
                    filterProductsForRemoval();
                    switchTab('adjust');
                } else {
                    showToast(data.error || 'Remove failed', '⚠️');
                }
            } catch (e) {
                showToast('Remove failed', '⚠️');
            }
        }

        async function removeProduct() {
            showRemoveConfirm();
        }
        function filterProductsForAdjustment() {
            const cat = document.getElementById('adjCategory').value;
            renderList(cat);
            if (selectedItem && cat && cat !== 'all' && selectedItem.category !== cat) {
                selectedItem = null;
                const searchInput = document.getElementById('adjSearch');
                searchInput.value = '';
                searchInput.classList.add('disabled');
                searchInput.style.borderColor = 'var(--ink)';
            }
        }

        function switchTab(tab) {
            const tabAdjust = document.getElementById('tabAdjust');
            const tabAdd = document.getElementById('tabAdd');
            const tabRemove = document.getElementById('tabRemove');
            const formAdjust = document.getElementById('formAdjust');
            const formAdd = document.getElementById('formAdd');
            const formRemove = document.getElementById('formRemove');
            const formTitle = document.getElementById('formTitle');

            tabAdjust.classList.remove('active');
            tabAdd.classList.remove('active');
            tabRemove.classList.remove('active');
            formAdjust.classList.remove('active');
            formAdd.classList.remove('active');
            formRemove.classList.remove('active');

            if (tab === 'adjust') {
                tabAdjust.classList.add('active');
                setTimeout(() => formAdjust.classList.add('active'), 50);
                formTitle.innerText = 'Manage Stock';
            } else if (tab === 'add') {
                tabAdd.classList.add('active');
                setTimeout(() => formAdd.classList.add('active'), 50);
                formTitle.innerText = 'New Registration';
            } else {
                tabRemove.classList.add('active');
                setTimeout(() => formRemove.classList.add('active'), 50);
                formTitle.innerText = 'Remove Product';
                loadInventory();
            }
        }

        function setOperation(op, btnElement) {
            document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentOperation = op;

            const label = document.getElementById('qtyLabel');
            const btns = document.getElementById('quickBtnsGroup');

            const qtyBox = document.getElementById('qtyBox');
            qtyBox.classList.remove('pulse');
            void qtyBox.offsetWidth;
            qtyBox.classList.add('pulse');

            if (op === 'add') {
                label.innerText = 'Quantity to Add (+)';
                btns.innerHTML = '<button class="quick-btn" onclick="setQty(10)">+10</button><button class="quick-btn" onclick="setQty(50)">+50</button><button class="quick-btn" onclick="setQty(100)">+100</button>';
            } else if (op === 'deduct') {
                label.innerText = 'Quantity to Deduct (-)';
                btns.innerHTML = '<button class="quick-btn" onclick="setQty(10)">-10</button><button class="quick-btn" onclick="setQty(50)">-50</button><button class="quick-btn" onclick="setQty(100)">-100</button>';
            } else {
                label.innerText = 'Set Exact Total (=)';
                btns.innerHTML = '<button class="quick-btn" onclick="setQty(0)">Set 0</button><button class="quick-btn" onclick="setQty(50)">Set 50</button><button class="quick-btn" onclick="setQty(100)">Set 100</button>';
            }
        }

        function triggerPulse(boxId) {
            const box = document.getElementById(boxId);
            box.classList.remove('pulse');
            void box.offsetWidth;
            box.classList.add('pulse');
        }

        function adjustQty(amount) {
            currentQty += amount;
            if (currentQty < 0) currentQty = 0;
            document.getElementById('qtyValue').innerText = currentQty;
            triggerPulse('qtyBox');
        }

        function setQty(val) {
            currentQty = val;
            document.getElementById('qtyValue').innerText = currentQty;
            triggerPulse('qtyBox');
        }

        function selectItemForAdjust(item, element) {
            if (document.getElementById('tabAdd').classList.contains('active')) {
                switchTab('adjust');
            }

            selectedItem = item;

            const searchInput = document.getElementById('adjSearch');
            const itemName = item.product || '';
            const itemSize = item.size || '';
            searchInput.value = itemSize ? `${itemName} (${itemSize})` : itemName;
            searchInput.classList.remove('disabled');
            searchInput.style.borderColor = 'var(--success)';
            searchInput.style.boxShadow = '4px 4px 0px var(--success)';
            setTimeout(() => { searchInput.style.boxShadow = '2px 2px 0px rgba(0,0,0,0.1)'; }, 500);

            document.querySelectorAll('.inv-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        async function submitAdjust() {
            if (!selectedItem) {
                showToast("Please select a product from the list first!", "⚠️");
                return;
            }

            const productId = selectedItem.product_id;
            const qty = currentQty;

            const form = new FormData();
            form.set('product_id', String(productId));
            form.set('qty', String(qty));
            form.set('inv_action', currentOperation);
            form.set('csrf_token', getCsrfToken());

            const btn = document.querySelector('#formAdjust .action-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            try {
                const res = await fetch('api/inventory_upsert.php', {
                    method: 'POST',
                    body: form,
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Update failed');

                const updated = data.inventory || {};
                const oldQty = Number(selectedItem.qty || 0);
                let newQty = Number(updated.qty || oldQty);

                if (currentOperation === 'add') newQty = oldQty + qty;
                else if (currentOperation === 'deduct') newQty = Math.max(0, oldQty - qty);
                else newQty = qty;

                selectedItem.qty = newQty;
                selectedItem.updated_at = updated.updated_at || selectedItem.updated_at;

                showToast(`Updated ${selectedItem.product || selectedItem.name}! (${oldQty} ➔ ${newQty})`, "📝");
                const currentFilter = document.getElementById('adjCategory').value;
                renderList(currentFilter);
            } catch (e) {
                showToast(e.message || 'Update failed', "⚠️");
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        let newQty = 50;

        function adjustNewQty(amount) {
            newQty += amount;
            if (newQty < 0) newQty = 0;
            document.getElementById('newQtyValue').innerText = newQty;
            triggerPulse('newQtyBox');
        }

        function setNewQty(val) {
            newQty = val;
            document.getElementById('newQtyValue').innerText = newQty;
            triggerPulse('newQtyBox');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUploadedImage = e.target.result;
                    document.getElementById('imagePreview').src = currentUploadedImage;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImagePreview(event) {
            if (event) event.stopPropagation();
            currentUploadedImage = null;
            document.getElementById('newImage').value = '';
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('imagePreview').src = '';
        }

        async function syncToLive() {
            const btn = document.getElementById('syncToLiveBtn');
            if (btn) { btn.disabled = true; btn.innerHTML = 'Syncing...'; }
            try {
                const res = await fetch('api/sync_to_live.php', { method: 'POST', credentials: 'same-origin' });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Sync failed');
                showToast(`Synced: ${data.created} created, ${data.skipped} skipped, ${data.qty_updated} qty updated`, '✅');
                if (data.errors && data.errors.length) console.warn('[syncToLive] errors:', data.errors);
            } catch (e) {
                showToast(e.message || 'Sync failed', '⚠️');
                console.error('[syncToLive] failed:', e);
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Sync to Live`; }
            }
        }

        async function submitNew() {
            const name = document.getElementById('newName').value.trim();
            const price = document.getElementById('newPrice').value;
            const size = document.getElementById('newSize').value.trim();
            const cat = document.getElementById('newCat').value;

            if (!name || !price || !size) {
                showToast("Please fill in all details for the new product.", "⚠️");
                return;
            }

            const form = new FormData();
            form.set('new_product_name', name);
            form.set('new_category', cat);
            form.set('new_product_description', 'Created via inventory');
            form.set('new_product_price', String(price));
            form.set('new_product_size', size);
            form.set('qty', String(newQty));
            form.set('inv_action', 'set');
            form.set('csrf_token', getCsrfToken());

            const imageInput = document.getElementById('newImage');
            if (imageInput.files && imageInput.files[0]) {
                form.set('product_image', imageInput.files[0]);
            }

            const btn = document.querySelector('#formAdd .action-btn.green');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Saving...';

            try {
                const res = await fetch('api/inventory_upsert.php', {
                    method: 'POST',
                    body: form,
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (!data.ok) throw new Error(data.error || 'Failed to register product');

                showToast("New Product Registered & Stock Posted!", "🎉");

                document.getElementById('newName').value = '';
                document.getElementById('newPrice').value = '0.00';
                document.getElementById('newSize').value = '';
                clearImagePreview();
                newQty = 50;
                document.getElementById('newQtyValue').innerText = newQty;

                switchTab('adjust');
                document.getElementById('adjCategory').value = '';
                await loadInventory();
            } catch (e) {
                showToast(e.message || 'Failed to register product', "⚠️");
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadInventory();
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadInventory();
            }
        });
    </script>
</body>
</html>
